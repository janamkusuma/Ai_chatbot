<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Reset Password</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="btn" href="login.html">← Back</a>
    <h2>Reset Password</h2>
  </header>

  <main class="container">
    <div class="panel">
      <h3>Enter OTP + New Password</h3>

      <input id="email" placeholder="Email" />
      <input id="otp" placeholder="OTP (6 digits)" />
      <input id="newPw" type="password" placeholder="New password" />
      <input id="confirmPw" type="password" placeholder="Confirm password" />

      <button class="btn primary" id="resetBtn" type="button">Reset Password</button>
      <p id="msg"></p>
    </div>
  </main>

  <script type="module" src="js/reset_password.js"></script>
</body>
</html>
