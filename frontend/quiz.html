<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Health Quiz</title>
  <link rel="stylesheet" href="css/style.css" />
  
</head>
<body>
  <header class="topbar">
    <button class="btn" onclick="goBack()">← Back</button>
    <h2>Health Quiz</h2>
    <button class="btn danger" id="logoutBtn" type="button">Logout</button>
  </header>

  <main class="container">
    <div class="panel quiz-wrap">
      <div id="quizStart" class="quiz-start">
        <h3>🧠 Select Quiz Category</h3>

        <div class="category-grid">

          <div class="category-card">
            <span>Infectious Diseases</span>
            <button class="start-btn" data-category="Infectious Diseases">Begin Quiz</button>
          </div>

          <div class="category-card">
            <span>Respiratory Diseases</span>
            <button class="start-btn" data-category="Respiratory Diseases">Begin Quiz</button>
            
          </div>

          <div class="category-card">
            <span>Digestive Diseases</span>
            <button class="start-btn" data-category="Digestive Diseases">Begin Quiz</button>
            
          </div>

          <div class="category-card">
            <span>Chronic Diseases</span>
            <button class="start-btn" data-category="Chronic Diseases">Begin Quiz</button>
            
          </div>

          <div class="category-card">
            <span>Heart Diseases</span>
            <button class="start-btn" data-category="Heart Diseases">Begin Quiz</button>
            
          </div>

          <div class="category-card">
            <span>Neurological Disorders</span>
            <button class="start-btn" data-category="Neurological Disorders">Begin Quiz</button>
            
          </div>

          <div class="category-card">
            <span>Skin Diseases</span>
            <button class="start-btn" data-category="Skin Diseases">Begin Quiz</button>
            
          </div>

          <div class="category-card">
            <span>Kidney Diseases</span>
            <button class="start-btn" data-category="Kidney Diseases">Begin Quiz</button>
            
          </div>

          <div class="category-card">
            <span>Liver Diseases</span>
            <button class="start-btn" data-category="Liver Diseases">Begin Quiz</button>
            
          </div>

          <div class="category-card">
            <span>Mental Health</span>
            <button class="start-btn" data-category="Mental Health">Begin Quiz</button>
            
          </div>

        </div>
      </div>

      <div id="quizBox" class="quiz-box" style="display:none;">
        <div class="quiz-top">
          <div class="quiz-qno" id="qno">Q1/10</div>
          <div class="quiz-timer">⏳ Time Left: <b id="timer">15</b>s</div>
        </div>

        <h3 id="question" class="quiz-question">Question here</h3>

        <div id="options" class="quiz-options"></div>

        <div class="quiz-bottom">
          <div id="status" class="quiz-status"></div>
          <button class="btn primary" id="nextBtn" disabled>Next</button>
        </div>
      </div>

      <div id="resultBox" class="quiz-result" style="display:none;">
        <h3>✅ Quiz Completed</h3>
        <p id="scoreText" style="font-size:18px;margin:8px 0;"></p>
        <div class="quiz-actions">
          <button class="btn primary" id="restartBtn">Restart</button>
          <a class="btn" href="quiz_history.html">View History</a>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="js/quiz.js"></script>
</body>
</html>
